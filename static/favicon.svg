<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="brass" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe7a8"/>
      <stop offset="50%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#6b4528"/>
    </radialGradient>
    <radialGradient id="led" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="55%" stop-color="#e02b2b"/>
      <stop offset="100%" stop-color="#7a1212"/>
    </radialGradient>
  </defs>
  <!-- Brass square -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#brass)" stroke="#2a2218" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- Red LED -->
  <circle cx="32" cy="32" r="9" fill="url(#led)"/>
  <circle cx="29.5" cy="29" r="2.5" fill="rgba(255,200,200,0.7)"/>
  <!-- Admin "A" badge -->
  <rect x="44" y="44" width="18" height="18" rx="5" fill="#1a1008" stroke="#ffb454" stroke-width="1.5"/>
  <text x="53" y="57" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffb454">A</text>
</svg>
